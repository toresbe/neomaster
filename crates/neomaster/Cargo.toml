[package]
name = "neomaster"
description = "Open-source panel software for the B&O BeoMaster 5"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
a-aux.workspace = true
settings.workspace = true
airplay.workspace = true
bs5-panel.workspace = true
masterlink.workspace = true
pc2.workspace = true
render = { workspace = true, features = ["xrender"] }
ui.workspace = true
radio.workspace = true
ma-client.workspace = true
library.workspace = true
player.workspace = true
log.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
x11rb = { version = "0.13", default-features = false, features = ["xkb"] }
# tokio: the PC2 actor awaits nusb inside the tokio runtime; without it nusb panics on open
nusb = { version = "0.2", features = ["tokio"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "test-util"] }
