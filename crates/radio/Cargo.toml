[package]
name = "radio"
description = "N.RADIO numbered presets: channel numbers from Beo4 digits, link rooms and the panel, mapped to Music Assistant radio stations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
default = ["ma"]
# Resolve and play presets through Music Assistant (the async half).
ma = ["dep:ma-client", "dep:serde_json"]

[dependencies]
log.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1"
ma-client = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
